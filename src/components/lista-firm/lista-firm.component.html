<div class="lista-firm-page">
  <div class="container">
    <div class="tabs-container">
      <button 
        class="tab-button" 
        [class.active]="activeTab === 'today'"
        (click)="onTabChange('today')">
        ⏰ Lista firm do kontaktu dzisiaj
      </button>
      <button 
        class="tab-button" 
        [class.active]="activeTab === 'all'"
        (click)="onTabChange('all')">
        📋 Lista firm
      </button>
    </div>

    <div class="content">
      <!-- Today's firms tab -->
      <app-lista-firm-today
        *ngIf="activeTab === 'today'"
        (firmaUpdated)="onFirmaUpdated($event)">
      </app-lista-firm-today>

      <!-- All firms tab -->
      <app-lista-firm-all
        *ngIf="activeTab === 'all'"
        (firmaUpdated)="onFirmaUpdated($event)">
      </app-lista-firm-all>
    </div>
  </div>
</div>
